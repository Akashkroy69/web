<!DOCTYPE html>
<html>
<head>
<style>
h1 {
  text-decoration: overline; /*overline, line-through, underline, underline overline, none, dotted red*/
  text-transform: capitalize;/*capitalize, uppercase, lowercase, none */
}
h2 {
  text-decoration: line-through;
  text-transform: uppercase;
}
h3 {
  text-decoration: underline;
  text-transform: lowercase;
}
h4 {
  text-decoration: underline overline;
  text-transform: none;
}
.p4 {
  text-decoration:  underline overline dotted red;
  text-transform: none;
}
.p5{
  text-decoration: underline wavy blue 1px;
}
</style>
</head>
<body>
<h1>Typography</h1>
<div class="text1">Welcome to codingal</div>
<div class="text2">Welcome to codingal</div>
<div class="text3">Welcome to codingal</div>
<p class="p1">Welcome to codingal</p>
<p class="p2">Welcome to codingal</p>
<p class="p3">Welcome to codingal</p>
<p class="p4">Welcome to codingal</p>
<p class="p5">Welcome to codingal</p>


</body>
</html>
