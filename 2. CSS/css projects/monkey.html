<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <svg width="500" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
    <!-- Background Gradient -->
    <defs>
      <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ffefd5; stop-opacity:1" />
        <stop offset="100%" style="stop-color:#f8b8c0; stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect width="500" height="150" fill="url(#backgroundGradient)" />
  
    <!-- Laptop -->
    <rect x="175" y="50" width="150" height="80" rx="10" ry="10" fill="#c0c0c0" />
    <rect x="175" y="45" width="150" height="10" fill="#a9a9a9" />
    <rect x="180" y="55" width="140" height="65" fill="#4b4b4b" />
    <text x="195" y="80" font-family="monospace" font-size="10" fill="white">
      &lt;code&gt;
    </text>
    <rect x="200" y="90" width="100" height="2" fill="#f28d35" />
    <rect x="200" y="100" width="100" height="2" fill="#0096c7" />
    <rect x="200" y="110" width="100" height="2" fill="#ffba08" />
  
    <!-- Rocket -->
    <ellipse cx="380" cy="70" rx="12" ry="24" fill="#e0e0e0" />
    <ellipse cx="380" cy="85" rx="15" ry="8" fill="#a9a9a9" />
    <circle cx="380" cy="60" r="5" fill="#4b4b4b" />
    <polygon points="375,90 385,90 380,110" fill="#ff6347" />
  
    <!-- Glasses -->
    <rect x="120" y="65" width="20" height="12" rx="5" ry="5" fill="#4b4b4b" />
    <rect x="160" y="65" width="20" height="12" rx="5" ry="5" fill="#4b4b4b" />
    <rect x="140" y="68" width="20" height="5" fill="#4b4b4b" />
    <circle cx="130" cy="71" r="8" fill="#c0c0c0" />
    <circle cx="170" cy="71" r="8" fill="#c0c0c0" />
  
    <!-- Reflection Line -->
    <line x1="0" y1="135" x2="500" y2="135" stroke="#ffc0cb" stroke-width="2" stroke-dasharray="2, 6" />
    <circle cx="15" cy="135" r="2" fill="#ffc0cb" />
    <circle cx="485" cy="135" r="2" fill="#ffc0cb" />
  </svg>
  
</body>
</html>
