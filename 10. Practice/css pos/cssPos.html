<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <style>
        #id1{
            height: 1500px;
            width: 1500px;
            background-color: lightblue;
            border: 2px solid black;
            position: relative;
        }
        /* position: static, relative, absolute, fixed, sticky */
        .box{
            width: 100px;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid black;
            margin: 20px;
            display: block;
            
        }
        #id4{
            position: absolute;
            top: 50px;
            left: 300px;
        }
        #id3{
            position: fixed;
            bottom: 50px;
            left: 10px;
        }
        #id5{
            position: sticky;
            top: 100px;
            left: 100px;
        }

    </style>
</head>
<body>
    <div id="id1">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box" id="id3">Box3</div>
        <div class="box" id="id4">Box4</div>
        <div class="box" id="id5">Box5</div>


    </div>
</body>
</html>
