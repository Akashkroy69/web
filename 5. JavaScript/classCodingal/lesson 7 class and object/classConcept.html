<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Concept</title>
</head>

<body bgcolor="red" text="white">
    <h1>hello buddy</h1>
    <script>
         for(var i =0;i<15;i=i+1){
            document.write("hello, i: ",i,"<br>")
        }
        for(var i =0;i<15;i=i+1){
            document.write("hello")
        }
        class Person {
            static myStaticProperty = "Hello, I'm static!";
            constructor(nameV, ageV, genderValue, isStudentV) {
                this.name = nameV;
                this.age = ageV;
                this.gender = genderValue;
                this.isStudent = isStudentV;
            }

            greet() {
                console.log("Hello!", this.name);
            }
        }
       

        // Creating an instance of the class
        let person = new Person("John", 25, true);

        console.log(person.name); // Accessing property
        person.greet(); // Calling method

    </script>
</body>

</html>
