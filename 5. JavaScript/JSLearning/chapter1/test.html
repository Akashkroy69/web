<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  
  <script>
    var num = Number(prompt("Enter age"))

    if(num <= 12){
      document.write("child")
    }
      // &&: and, ||: OR, !: not
    else if(num >13 && num <=19 ){
      document.write("adolescent")
    }
    else if(num>=20 && num<=50){
      document.write("working demographic")
    }
    else if(num>=51 && num <=117){
      document.write("citizen") 
    }
    else(num >=118)
      document.write("non-existencial")
    
      
    
      
    
  </script>
</body>

</html>
